<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Stadium - Header Directly Above Grass</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: #060911;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    position: relative;
    user-select: none;
  }

  /* 3D Stadium Viewport - Centered across height */
  .stadium-viewport {
    position: absolute;
    top: 240px;
    left: 0;
    width: 1080px;
    height: 1380px;
    perspective: 1200px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* 3D Stadium Bowl */
  .stadium-bowl {
    position: relative;
    width: 1040px;
    height: 1320px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(14,24,38,0.2) 20%, rgba(16,24,40,0.95) 55%, #080d16 100%);
    box-shadow: inset 0 0 100px rgba(0,0,0,0.95), 0 0 60px rgba(0,240,255,0.12);
    display: flex;
    justify-content: center;
    align-items: center;
    transform: rotateX(34deg);
    border: 4px solid rgba(255,255,255,0.1);
  }

  .seating-ring-1 {
    position: absolute;
    width: 960px;
    height: 1240px;
    border-radius: 50%;
    border: 22px solid #162c4e;
    box-shadow: inset 0 0 25px #0a1320;
  }
  .seating-ring-2 {
    position: absolute;
    width: 890px;
    height: 1160px;
    border-radius: 50%;
    border: 22px solid #7a1824;
    box-shadow: inset 0 0 25px #3a0a10;
  }
  .seating-ring-3 {
    position: absolute;
    width: 820px;
    height: 1080px;
    border-radius: 50%;
    border: 18px solid #173864;
  }

  /* Pitch */
  .pitch-turf {
    position: relative;
    width: 640px;
    height: 960px;
    background: repeating-linear-gradient(
      to bottom,
      #1e6b32 0px,
      #1e6b32 68px,
      #175427 68px,
      #175427 136px
    );
    border: 5px solid rgba(255,255,255,0.88);
    border-radius: 4px;
    box-shadow: 0 0 60px rgba(0,255,120,0.35), inset 0 0 25px rgba(0,0,0,0.45);
  }

  .pitch-line-half {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.85);
    transform: translateY(-50%);
  }
  .pitch-circle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 160px;
    height: 160px;
    border: 4px solid rgba(255,255,255,0.85);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .pen-box-top {
    position: absolute;
    top: 0;
    left: 50%;
    width: 350px;
    height: 145px;
    border: 4px solid rgba(255,255,255,0.85);
    border-top: none;
    transform: translateX(-50%);
  }
  .pen-box-bottom {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 350px;
    height: 145px;
    border: 4px solid rgba(255,255,255,0.85);
    border-bottom: none;
    transform: translateX(-50%);
  }

  /* Floodlights */
  .floodlight {
    position: absolute;
    width: 480px;
    height: 750px;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.3) 0%, rgba(0,240,255,0.1) 40%, transparent 75%);
    pointer-events: none;
    filter: blur(14px);
  }
  .fl-tl { top: -60px; left: -60px; transform: rotate(-35deg); }
  .fl-tr { top: -60px; right: -60px; transform: rotate(35deg); }
  .fl-bl { bottom: -60px; left: -60px; transform: rotate(-145deg); }
  .fl-br { bottom: -60px; right: -60px; transform: rotate(145deg); }

  /* Tactical Player Slots */
  .player-slot {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 280px;
    transform: translate(-50%, -50%);
    z-index: 50;
  }

  .sil-img {
    width: 140px;
    height: 140px;
    object-fit: contain;
    filter: drop-shadow(0 16px 12px rgba(0,0,0,0.85));
  }

  .clue-row {
    position: absolute;
    top: 42px;
    width: 250px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }
  .badge-pos {
    background: #00F0FF;
    color: #000;
    font-size: 19px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }
  .badge-flag {
    background: rgba(14,22,34,0.92);
    border: 2px solid rgba(255,255,255,0.4);
    font-size: 26px;
    padding: 2px 10px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }
  .badge-locked {
    background: rgba(18,26,42,0.92);
    border: 2px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 18px;
    padding: 6px 12px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }

  .nameplate {
    margin-top: -8px;
    background: rgba(10,16,26,0.95);
    border: 2px solid rgba(255,215,0,0.85);
    border-radius: 10px;
    padding: 5px 22px;
    font-size: 20px;
    font-weight: 800;
    color: #FFD700;
    box-shadow: 0 6px 18px rgba(0,0,0,0.8);
    letter-spacing: 2px;
  }

  .slot-fwd-1 { top: 22%; left: 30%; }
  .slot-fwd-2 { top: 22%; left: 70%; }
  .slot-mid-1 { top: 49%; left: 25%; }
  .slot-mid-2 { top: 49%; left: 75%; }
  .slot-def-1 { top: 78%; left: 28%; }
  .slot-def-2 { top: 78%; left: 72%; }

  /* Broadcast Header: Floating RIGHT ABOVE THE PITCH */
  .broadcast-header {
    position: absolute;
    top: 410px;
    left: 0;
    width: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 100;
    text-align: center;
  }
  .header-prompt {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    text-shadow: 0 3px 12px rgba(0,0,0,0.95);
  }
  .match-criteria {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .crit-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(16,24,38,0.96);
    border-radius: 18px;
    padding: 10px 22px;
    min-width: 400px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.85);
  }
  .crit-a { border: 3px solid #00F0FF; }
  .crit-b { border: 3px solid #A855F7; }
  .club-logo { width: 66px; height: 66px; object-fit: contain; }
  .crit-emoji { font-size: 50px; line-height: 66px; width: 66px; text-align: center; }
  .crit-text-main { font-size: 26px; font-weight: 800; color: #fff; }
  .crit-text-sub { font-size: 18px; font-weight: 700; text-transform: uppercase; }
  .col-cyan { color: #00F0FF; }
  .col-purple { color: #A855F7; }
  .connector-and {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #060911;
    border: 3px solid #FFD700;
    color: #FFD700;
    font-size: 26px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .total-count-pill {
    margin-top: 10px;
    font-size: 22px;
    font-weight: 800;
    color: #94a3b8;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }

  /* Footer CTA */
  .broadcast-footer {
    position: absolute;
    bottom: 230px;
    left: 0;
    width: 1080px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .footer-cta-text {
    font-size: 33px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 3px 12px rgba(0,0,0,0.95);
  }
  .playmaker-pill-btn {
    background: #FFD700;
    color: #000;
    font-size: 27px;
    font-weight: 900;
    padding: 15px 50px;
    border-radius: 40px;
    box-shadow: 0 0 35px rgba(255,215,0,0.45);
    letter-spacing: 0.5px;
  }
</style>
</head>
