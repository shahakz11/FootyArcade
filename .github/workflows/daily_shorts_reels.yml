name: Daily Social Auto-Publisher (Carousels & Shorts)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publishing mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - career_flight
          - carousel
          - short
          - all
      game:
        description: 'Specific game ID (optional override, e.g. top_transfers)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (render only, do not upload)'
        required: false
        default: false
        type: boolean
      fast:
        description: 'Fast preview mode for testing'
        required: false
        default: false
        type: boolean
      force:
        description: 'Force re-render & re-upload (bypasses deduplication checks)'
        required: false
        default: false
        type: boolean

# Prevent concurrent runs
concurrency:
  group: daily-shorts-reels
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Fast, lean execution (<3 minutes per run)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Restore API Secrets & Credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          INSTAGRAM_CONFIG: ${{ secrets.INSTAGRAM_CONFIG }}
          TIKTOK_CONFIG: ${{ secrets.TIKTOK_CONFIG }}
        run: |
          mkdir -p private
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > private/youtube_token.json
            echo "✅ Restored YouTube credentials from JSON."
          elif [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 --decode > private/youtube_token.pickle
            echo "✅ Restored YouTube credentials from Base64 pickle."
          else
            echo "❌ Error: Neither YOUTUBE_TOKEN_JSON nor YOUTUBE_TOKEN_BASE64 secret is configured!"
            exit 1
          fi

          if [ -z "$INSTAGRAM_CONFIG" ]; then
            echo "❌ Error: INSTAGRAM_CONFIG secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          echo "$INSTAGRAM_CONFIG" > private/instagram_config.json
          echo "✅ Restored Instagram credentials."

          if [ -n "$TIKTOK_CONFIG" ]; then
            echo "$TIKTOK_CONFIG" > private/tiktok_config.json
            echo "✅ Restored TikTok credentials."
          fi

      - name: Verify Credentials Health
        run: |
          python3 scripts/youtube_uploader.py --channel
          python3 scripts/instagram_uploader.py --check
          if [ -f private/tiktok_config.json ]; then
            python3 scripts/tiktok_uploader.py --verify || true
          fi

      - name: Verify B-Roll Library
        run: |
          python3 scripts/fetch_broll.py --list

      - name: Run Shorts & Reels Publisher
        env:
          CI: "true"
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_GAME: ${{ github.event.inputs.game }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FAST: ${{ github.event.inputs.fast }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          CMD="python3 -u scripts/upload_daily_shorts.py"
          if [ -n "$INPUT_MODE" ]; then
            CMD="$CMD --mode $INPUT_MODE"
          fi
          if [ -n "$INPUT_GAME" ]; then
            CMD="$CMD --game $INPUT_GAME"
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "$INPUT_FAST" = "true" ]; then
            CMD="$CMD --fast"
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            CMD="$CMD --force"
          fi
          echo "Executing: $CMD"
          $CMD

      - name: Auto-Reply to Correct Answers on Recent Reels
        run: |
          python3 -u scripts/auto_reply_comments.py --limit 20

