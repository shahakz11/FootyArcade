name: Daily Shorts & Reels Auto-Publisher

on:
  schedule:
    # Primary trigger: 07:45 UTC (10:45 AM local time) - off-peak minute avoids top-of-hour congestion
    - cron: '45 7 * * *'
    # Fallback trigger: 08:35 UTC (11:35 AM local time) - if earlier run was delayed or missed
    - cron: '35 8 * * *'
  workflow_dispatch:
    inputs:
      game:
        description: 'Specific game ID (leave blank for all 6 games)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (render only, do not upload)'
        required: false
        default: false
        type: boolean
      fast:
        description: 'Fast preview mode for testing'
        required: false
        default: false
        type: boolean
      force:
        description: 'Force re-render & re-upload (bypasses deduplication checks)'
        required: false
        default: false
        type: boolean

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Allows up to 6 hours for staggered 1-hr interval publishing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Restore API Secrets & Credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          INSTAGRAM_CONFIG: ${{ secrets.INSTAGRAM_CONFIG }}
        run: |
          mkdir -p private
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > private/youtube_token.json
            echo "✅ Restored YouTube credentials from JSON."
          elif [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 --decode > private/youtube_token.pickle
            echo "✅ Restored YouTube credentials from Base64 pickle."
          else
            echo "❌ Error: Neither YOUTUBE_TOKEN_JSON nor YOUTUBE_TOKEN_BASE64 secret is configured!"
            exit 1
          fi

          if [ -z "$INSTAGRAM_CONFIG" ]; then
            echo "❌ Error: INSTAGRAM_CONFIG secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          echo "$INSTAGRAM_CONFIG" > private/instagram_config.json
          echo "✅ Restored Instagram credentials."

      - name: Verify Credentials Health
        run: |
          python3 scripts/youtube_uploader.py --channel
          python3 scripts/instagram_uploader.py --check

      - name: Run Daily Batch Pipeline (Shorts & Reels)
        env:
          INPUT_GAME: ${{ github.event.inputs.game }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_FAST: ${{ github.event.inputs.fast }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          CMD="python3 -u scripts/upload_daily_shorts.py --wait-queue"
          if [ -n "$INPUT_GAME" ]; then
            CMD="$CMD --game $INPUT_GAME"
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "$INPUT_FAST" = "true" ]; then
            CMD="$CMD --fast"
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            CMD="$CMD --force"
          fi
          echo "Executing: $CMD"
          $CMD
