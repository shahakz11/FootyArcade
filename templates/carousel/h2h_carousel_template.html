<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350, initial-scale=1.0">
  <title>Playmaker H2H Showdown</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1350px;
      background: #080c14;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient stadium glow */
    .ambient-glow {
      position: absolute;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 1200px;
      height: 600px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, rgba(16, 185, 129, 0.12) 40%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid backdrop */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }

    /* Header Bar */
    .slide-header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 48px 56px 20px 56px;
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-img {
      height: 46px;
      object-fit: contain;
    }

    .category-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1.5px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 8px 18px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    /* Slide Container */
    .slide-content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 56px 40px 56px;
    }

    /* Slide 1: Hook Cover Styles */
    .cover-title-wrap {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    .cover-pretitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .cover-main-title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .split-showdown {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 80px 1fr;
      align-items: center;
      position: relative;
      margin-bottom: 30px;
    }

    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(15, 23, 42, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 36px 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      height: 100%;
      justify-content: space-between;
    }

    .player-card.glow-a {
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.15);
    }

    .player-card.glow-b {
      border-color: rgba(244, 63, 94, 0.35);
      box-shadow: 0 0 35px rgba(244, 63, 94, 0.15);
    }

    .player-photo-wrap {
      width: 280px;
      height: 330px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background: #1e293b;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .player-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .player-name {
      font-size: 34px;
      font-weight: 800;
      margin-top: 18px;
      margin-bottom: 6px;
      line-height: 1.15;
    }

    .player-meta {
      font-size: 20px;
      color: #94a3b8;
      font-weight: 600;
    }

    .vs-divider {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .vs-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #0f172a;
      border: 3px solid #fbbf24;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 900;
      color: #fbbf24;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.4);
    }

    .cover-swipe-cta {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      padding: 18px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* Slide 2-5: Stat Breakdown Cards */
    .stat-page-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .mini-player-badge {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      padding: 12px 20px;
      border-radius: 18px;
    }

    .mini-player-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .mini-player-name {
      font-size: 24px;
      font-weight: 800;
    }

    .mini-player-team {
      font-size: 16px;
      color: #94a3b8;
    }

    .page-main-title {
      font-size: 42px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .stat-rows-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }

    .stat-row-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 22px 30px;
      display: grid;
      grid-template-columns: 180px 1fr 180px;
      align-items: center;
      position: relative;
    }

    .stat-val-a, .stat-val-b {
      font-family: 'JetBrains Mono', monospace;
      font-size: 38px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-val-a {
      justify-content: flex-start;
      color: #ffffff;
    }

    .stat-val-b {
      justify-content: flex-end;
      color: #ffffff;
    }

    .winner-highlight {
      color: #10b981 !important;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }

    .stat-label-wrap {
      text-align: center;
    }

    .stat-label-title {
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
    }

    .stat-label-sub {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }

    .winner-crown {
      font-size: 24px;
    }

    /* Outro Slide Styles */
    .outro-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(15, 23, 42, 0.7);
      border: 2px solid rgba(251, 191, 36, 0.3);
      border-radius: 32px;
      padding: 50px 40px;
      box-shadow: 0 0 50px rgba(251, 191, 36, 0.15);
    }

    .outro-badge {
      background: #fbbf24;
      color: #080c14;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 900;
      padding: 10px 24px;
      border-radius: 999px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .outro-question {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .outro-subtext {
      font-size: 28px;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 40px;
      line-height: 1.4;
    }

    .outro-cta-box {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      padding: 22px 48px;
      border-radius: 20px;
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
    }

    /* Footer / Slide indicator */
    .slide-footer {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 56px 40px 56px;
      font-size: 18px;
      color: #64748b;
      font-weight: 600;
    }

    .slide-dots {
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }

    .dot.active {
      width: 32px;
      border-radius: 6px;
      background: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="grid-bg"></div>

  <!-- Header -->
  <header class="slide-header">
    <div class="brand-logo-wrap">
      <img src="../../assets/playmaker_header_logo.png" alt="Playmaker" class="brand-logo-img">
    </div>
    <div class="category-badge" id="category-badge">HEAD TO HEAD</div>
  </header>

  <!-- Dynamic Slide Container -->
  <main class="slide-content" id="slide-content">
    <!-- Populated dynamically via JS or rendered per slide index -->
  </main>

  <!-- Footer -->
  <footer class="slide-footer">
    <div id="footer-left">PLAYMAKER.BEST ⚽ DAILY FOOTBALL TRIVIA</div>
    <div class="slide-dots" id="slide-dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </footer>

  <script>
    // Injected payload data
    window.SLIDE_DATA = window.SLIDE_DATA || {
      slideIndex: 1, // 1 to 6
      playerA: {
        name: "Eden Hazard",
        nationality: "Belgium",
        position: "Left Winger",
        imagePath: "../../assets/players/eden_hazard.jpg",
        totalApps: 749,
        totalGoals: 200,
        totalAssists: 154,
        totalGA: 354,
        goalsPerGame: "0.27",
        minsPerGA: "135.2",
        clubGoals: 167,
        clubApps: 623,
        intlCaps: 126,
        intlGoals: 33,
        wcGoals: 3,
        euroGoals: 1,
        qualGoals: 20
      },
      playerB: {
        name: "Neymar",
        nationality: "Brazil",
        position: "Left Winger",
        imagePath: "../../assets/players/neymar.jpg",
        totalApps: 739,
        totalGoals: 445,
        totalAssists: 227,
        totalGA: 672,
        goalsPerGame: "0.60",
        minsPerGA: "84.1",
        clubGoals: 366,
        clubApps: 611,
        intlCaps: 128,
        intlGoals: 79,
        wcGoals: 9,
        euroGoals: 0,
        copaGoals: 5,
        qualGoals: 16
      }
    };

    function renderSlide(index) {
      const data = window.SLIDE_DATA;
      const pA = data.playerA;
      const pB = data.playerB;
      const container = document.getElementById('slide-content');
      const dotsContainer = document.getElementById('slide-dots');

      // Update dots
      if (dotsContainer) {
        dotsContainer.innerHTML = [1, 2, 3, 4, 5, 6].map(i => 
          `<div class="dot ${i === index ? 'active' : ''}"></div>`
        ).join('');
      }

      if (index === 1) {
        // Slide 1: Hook Cover
        container.innerHTML = `
          <div class="cover-title-wrap">
            <div class="cover-pretitle">PRIME VS PRIME</div>
            <h1 class="cover-main-title">WHO HAD THE BETTER CAREER?</h1>
          </div>
          <div class="split-showdown">
            <div class="player-card glow-a">
              <div class="player-photo-wrap">
                <img src="${pA.imagePath}" alt="${pA.name}" class="player-photo">
              </div>
              <div class="player-info">
                <div class="player-name">${pA.name}</div>
                <div class="player-meta">${pA.nationality} • ${pA.position}</div>
              </div>
            </div>
            <div class="vs-divider">
              <div class="vs-circle">VS</div>
            </div>
            <div class="player-card glow-b">
              <div class="player-photo-wrap">
                <img src="${pB.imagePath}" alt="${pB.name}" class="player-photo">
              </div>
              <div class="player-info">
                <div class="player-name">${pB.name}</div>
                <div class="player-meta">${pB.nationality} • ${pB.position}</div>
              </div>
            </div>
          </div>
          <div class="cover-swipe-cta">
            <span>SWIPE FOR STATS BREAKDOWN</span> <span>👉</span>
          </div>
        `;
      } else if (index === 2) {
        // Slide 2: The Big Numbers (Overall Career)
        container.innerHTML = `
          <div class="stat-page-header">
            <div class="mini-player-badge">
              <img src="${pA.imagePath}" class="mini-player-avatar">
              <div><div class="mini-player-name">${pA.name}</div><div class="mini-player-team">${pA.nationality}</div></div>
            </div>
            <div class="mini-player-badge" style="justify-content: flex-end; text-align: right;">
              <div><div class="mini-player-name">${pB.name}</div><div class="mini-player-team">${pB.nationality}</div></div>
              <img src="${pB.imagePath}" class="mini-player-avatar">
            </div>
          </div>
          <h2 class="page-main-title">OVERALL CAREER TOTALS</h2>
          <div class="stat-rows-container">
            ${renderStatRow('Career Appearances', pA.totalApps, pB.totalApps, 'Club + Country Senior')}
            ${renderStatRow('Career Goals', pA.totalGoals, pB.totalGoals, 'All Official Competitions')}
            ${renderStatRow('Career Assists', pA.totalAssists, pB.totalAssists, 'Club & International')}
            ${renderStatRow('Total G+A', pA.totalGA, pB.totalGA, 'Goal Contributions')}
            ${renderStatRow('Goals per Match', pA.goalsPerGame, pB.goalsPerGame, 'Career Average')}
          </div>
        `;
      } else if (index === 3) {
        // Slide 3: Club Dominance
        container.innerHTML = `
          <div class="stat-page-header">
            <div class="mini-player-badge">
              <img src="${pA.imagePath}" class="mini-player-avatar">
              <div><div class="mini-player-name">${pA.name}</div><div class="mini-player-team">Club Career</div></div>
            </div>
            <div class="mini-player-badge" style="justify-content: flex-end; text-align: right;">
              <div><div class="mini-player-name">${pB.name}</div><div class="mini-player-team">Club Career</div></div>
              <img src="${pB.imagePath}" class="mini-player-avatar">
            </div>
          </div>
          <h2 class="page-main-title">CLUB LEVEL SHOWDOWN</h2>
          <div class="stat-rows-container">
            ${renderStatRow('Club Appearances', pA.clubApps, pB.clubApps, 'Senior Club Matches')}
            ${renderStatRow('Club Goals', pA.clubGoals, pB.clubGoals, 'Domestic + Continental')}
            ${renderStatRow('Club Assists', pA.totalAssists, pB.totalAssists, 'Recorded Assists')}
            ${renderStatRow('Club G+A', pA.clubGoals + pA.totalAssists, pB.clubGoals + pB.totalAssists, 'Direct Goal Involvements')}
          </div>
        `;
      } else if (index === 4) {
        // Slide 4: International Legacy
        container.innerHTML = `
          <div class="stat-page-header">
            <div class="mini-player-badge">
              <img src="${pA.imagePath}" class="mini-player-avatar">
              <div><div class="mini-player-name">${pA.name}</div><div class="mini-player-team">${pA.nationality}</div></div>
            </div>
            <div class="mini-player-badge" style="justify-content: flex-end; text-align: right;">
              <div><div class="mini-player-name">${pB.name}</div><div class="mini-player-team">${pB.nationality}</div></div>
              <img src="${pB.imagePath}" class="mini-player-avatar">
            </div>
          </div>
          <h2 class="page-main-title">INTERNATIONAL RECORD</h2>
          <div class="stat-rows-container">
            ${renderStatRow('Senior Caps', pA.intlCaps, pB.intlCaps, 'Official Senior Matches')}
            ${renderStatRow('International Goals', pA.intlGoals, pB.intlGoals, 'Senior National Team')}
            ${renderStatRow('World Cup Goals', pA.wcGoals, pB.wcGoals, 'FIFA World Cup Finals')}
            ${renderStatRow('Continental Goals', pA.euroGoals || pA.copaGoals || 0, pB.euroGoals || pB.copaGoals || 0, 'Euros / Copa América')}
          </div>
        `;
      } else if (index === 5) {
        // Slide 5: Efficiency & Ratio
        container.innerHTML = `
          <div class="stat-page-header">
            <div class="mini-player-badge">
              <img src="${pA.imagePath}" class="mini-player-avatar">
              <div><div class="mini-player-name">${pA.name}</div><div class="mini-player-team">Prime Output</div></div>
            </div>
            <div class="mini-player-badge" style="justify-content: flex-end; text-align: right;">
              <div><div class="mini-player-name">${pB.name}</div><div class="mini-player-team">Prime Output</div></div>
              <img src="${pB.imagePath}" class="mini-player-avatar">
            </div>
          </div>
          <h2 class="page-main-title">PRIME EFFICIENCY</h2>
          <div class="stat-rows-container">
            ${renderStatRow('Minutes per G+A', (pA.minsPerGA ? pA.minsPerGA + 'm' : 'N/A'), (pB.minsPerGA ? pB.minsPerGA + 'm' : 'N/A'), 'Lower is Better', true)}
            ${renderStatRow('Goal Involvement %', pA.goalsPerGame + '/gm', pB.goalsPerGame + '/gm', 'Goals Per Appearance')}
            ${renderStatRow('Peak Valuation', '€' + ((pA.peakMarketValue || 100000000) / 1000000).toFixed(0) + 'M', '€' + ((pB.peakMarketValue || 180000000) / 1000000).toFixed(0) + 'M', 'Highest Transfer Valuation')}
          </div>
        `;
      } else if (index === 6) {
        // Slide 6: Outro & Debate CTA
        container.innerHTML = `
          <div class="outro-card">
            <div class="outro-badge">THE ULTIMATE DEBATE</div>
            <h2 class="outro-question">WHO ARE YOU PICKING IN THEIR PRIME?</h2>
            <div class="outro-subtext">
              <strong style="color: #38bdf8;">${pA.name}</strong> OR <strong style="color: #f43f5e;">${pB.name}</strong>?<br>
              Drop your answer in the comments! 👇
            </div>
            <div class="outro-cta-box">
              🎮 PLAY DAILY TRIVIA AT PLAYMAKER.BEST
            </div>
          </div>
        `;
      }
    }

    function renderStatRow(title, valA, valB, subtext = '', lowerIsBetter = false) {
      let numA = parseFloat(String(valA).replace(/[^0-9.]/g, '')) || 0;
      let numB = parseFloat(String(valB).replace(/[^0-9.]/g, '')) || 0;
      let winA = false;
      let winB = false;

      if (numA !== numB) {
        if (lowerIsBetter) {
          winA = numA < numB && numA > 0;
          winB = numB < numA && numB > 0;
        } else {
          winA = numA > numB;
          winB = numB > numA;
        }
      }

      return `
        <div class="stat-row-card">
          <div class="stat-val-a ${winA ? 'winner-highlight' : ''}">
            ${winA ? '<span class="winner-crown">👑</span>' : ''} ${valA}
          </div>
          <div class="stat-label-wrap">
            <div class="stat-label-title">${title}</div>
            ${subtext ? `<div class="stat-label-sub">${subtext}</div>` : ''}
          </div>
          <div class="stat-val-b ${winB ? 'winner-highlight' : ''}">
            ${valB} ${winB ? '<span class="winner-crown">👑</span>' : ''}
          </div>
        </div>
      `;
    }

    // Auto-render on load based on URL hash (e.g. #slide-2) or default to 1
    const hash = window.location.hash;
    const initialSlide = hash.startsWith('#slide-') ? parseInt(hash.replace('#slide-', '')) : 1;
    renderSlide(initialSlide || 1);
  </script>
</body>
</html>
